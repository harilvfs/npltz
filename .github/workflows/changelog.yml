name: Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. 1.1.1)'
        required: true
      target_branch:
        description: 'Target branch for the PR'
        required: false
        default: 'main'

jobs:
  generate_changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: "v2.13.1"
          config: cliff.toml
          args: -o CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: create_changelog_pr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore(release): update changelog for v${{ github.event.inputs.version }}"
          branch: changelog/${{ github.event.inputs.version }}
          title: "changelog for v${{ github.event.inputs.version }}"
          body: |
            changelog for version v${{ github.event.inputs.version }}.
          base: ${{ github.event.inputs.target_branch }}
          delete-branch: false

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Merge PR
        if: steps.create_changelog_pr.outputs.pull-request-number != ''
        run: |
          gh pr merge changelog/${{ github.event.inputs.version }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
