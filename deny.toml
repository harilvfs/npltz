[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = false

[advisories]
yanked = "deny"
version = 2
# RUSTSEC-2026-0543: chrono is unmaintained, no safe upgrade available yet.
# TODO: migrate to `jiff` (or `time`) and remove this ignore.
ignore = ["RUSTSEC-2026-0543"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
